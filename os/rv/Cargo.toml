[package]
name = "rv"
version = "0.1.0"
edition = "2024"

[dependencies]

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"

[features]
# boots into the in-kernel test runner instead of rust_main's normal path: `cargo ktest`
test = []

[[bin]]
name = "rv"
path = "src/main.rs"
# the std test harness can't build for no_std; tests run in QEMU via `cargo ktest`
test = false
bench = false
